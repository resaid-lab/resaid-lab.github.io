<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#17365C" opacity="0.04"/>
    </pattern>
    <marker id="mN" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#17365C"/>
    </marker>
    <marker id="mS" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5A6E85"/>
    </marker>
    <marker id="mR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C94A3F"/>
    </marker>
    <marker id="mRd" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C94A3F" opacity="0.45"/>
    </marker>
    <marker id="mC" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A8683B"/>
    </marker>
    <marker id="mLS" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9FB3CB"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#dots)"/>

  <!-- ==================== dashed influence lines (DAG -> pipeline) ==================== -->
  <g stroke-width="2" fill="none" stroke-dasharray="5 7">
    <line x1="240" y1="238" x2="240" y2="418" stroke="#5A6E85" opacity="0.45" marker-end="url(#mS)"/>
    <line x1="480" y1="258" x2="480" y2="418" stroke="#5A6E85" opacity="0.45" marker-end="url(#mS)"/>
    <line x1="720" y1="263" x2="720" y2="418" stroke="#C94A3F" opacity="0.6" marker-end="url(#mR)"/>
    <line x1="960" y1="245" x2="960" y2="418" stroke="#5A6E85" opacity="0.45" marker-end="url(#mS)"/>
  </g>

  <!-- ==================== causal DAG (top) ==================== -->
  <!-- edges -->
  <g stroke="#17365C" stroke-width="2.5" fill="none">
    <line x1="385.0" y1="119.9" x2="255.9" y2="204.6" marker-end="url(#mN)"/>
    <line x1="409.7" y1="125.2" x2="469.8" y2="219.0" marker-end="url(#mN)"/>
    <line x1="606.8" y1="117.2" x2="493.9" y2="222.1" marker-end="url(#mN)"/>
    <line x1="257.9" y1="216.5" x2="461.1" y2="233.4" marker-end="url(#mN)"/>
    <line x1="737.9" y1="238.7" x2="941.1" y2="223.4" marker-end="url(#mN)"/>
  </g>
  <!-- biased edge B -> E, severed at the cut -->
  <line x1="630.7" y1="119.5" x2="663.5" y2="163.7" stroke="#C94A3F" stroke-width="3" fill="none"/>
  <line x1="676.5" y1="181.3" x2="708.7" y2="224.7" stroke="#C94A3F" stroke-width="2.5" opacity="0.4" stroke-dasharray="6 5" marker-end="url(#mRd)"/>

  <!-- copper intervention: arrow + scissors-like cut marks -->
  <path d="M 848 106 C 795 112, 736 130, 690 157" stroke="#A8683B" stroke-width="3" fill="none" marker-end="url(#mC)"/>
  <g stroke="#A8683B" stroke-width="3.5" stroke-linecap="round">
    <line x1="657.0" y1="175.6" x2="676.7" y2="161.0"/>
    <line x1="663.3" y1="184.0" x2="683.0" y2="169.4"/>
  </g>

  <!-- nodes -->
  <g fill="#FFFFFF" stroke="#17365C" stroke-width="3">
    <circle cx="400" cy="110" r="15"/>
    <circle cx="620" cy="105" r="15"/>
    <circle cx="240" cy="215" r="15"/>
    <circle cx="480" cy="235" r="15"/>
    <circle cx="960" cy="222" r="15"/>
  </g>
  <circle cx="720" cy="240" r="15" fill="#FFFFFF" stroke="#C94A3F" stroke-width="3"/>
  <text x="720" y="246.5" font-family="Helvetica, Arial, sans-serif" font-size="17" font-style="italic" fill="#C94A3F" text-anchor="middle">&#948;</text>

  <!-- ==================== pipeline (bottom) ==================== -->
  <!-- in/out stubs -->
  <g stroke="#9FB3CB" stroke-width="2.5" fill="none">
    <line x1="92" y1="475" x2="130" y2="475" marker-end="url(#mLS)"/>
    <line x1="1063" y1="475" x2="1098" y2="475" marker-end="url(#mLS)"/>
  </g>

  <!-- stage blocks -->
  <rect x="145" y="430" width="190" height="90" rx="10" fill="#FFFFFF" stroke="#17365C" stroke-width="2.5"/>
  <rect x="385" y="430" width="190" height="90" rx="10" fill="#FFFFFF" stroke="#17365C" stroke-width="2.5"/>
  <rect x="625" y="430" width="190" height="90" rx="10" fill="#C94A3F" fill-opacity="0.08" stroke="#C94A3F" stroke-width="3"/>
  <rect x="865" y="430" width="190" height="90" rx="10" fill="#FFFFFF" stroke="#17365C" stroke-width="2.5"/>

  <!-- inter-stage arrows -->
  <g stroke="#17365C" stroke-width="2.5" fill="none">
    <line x1="341" y1="475" x2="374" y2="475" marker-end="url(#mN)"/>
    <line x1="581" y1="475" x2="614" y2="475" marker-end="url(#mN)"/>
    <line x1="821" y1="475" x2="854" y2="475" marker-end="url(#mN)"/>
  </g>

  <!-- stage 1 motif: data cylinder -->
  <g stroke="#5A6E85" stroke-width="2.2" fill="none">
    <ellipse cx="240" cy="453" rx="25" ry="8.5"/>
    <line x1="215" y1="453" x2="215" y2="495"/>
    <line x1="265" y1="453" x2="265" y2="495"/>
    <path d="M 215 495 A 25 8.5 0 0 0 265 495"/>
    <path d="M 215 469 A 25 8.5 0 0 0 265 469" opacity="0.5"/>
  </g>

  <!-- stage 2 motif: feature map glyph -->
  <text x="480" y="487" font-family="Helvetica, Arial, sans-serif" font-size="34" font-style="italic" fill="#5A6E85" text-anchor="middle">&#966;</text>

  <!-- stage 3 motif: small model graph (biased stage) -->
  <g stroke="#C94A3F" stroke-width="1.8" opacity="0.65">
    <line x1="692" y1="458" x2="750" y2="467"/>
    <line x1="692" y1="458" x2="750" y2="485"/>
    <line x1="692" y1="476" x2="750" y2="467"/>
    <line x1="692" y1="476" x2="750" y2="485"/>
    <line x1="692" y1="494" x2="750" y2="467"/>
    <line x1="692" y1="494" x2="750" y2="485"/>
  </g>
  <g fill="#C94A3F" opacity="0.9">
    <circle cx="692" cy="458" r="4.6"/>
    <circle cx="692" cy="476" r="4.6"/>
    <circle cx="692" cy="494" r="4.6"/>
    <circle cx="750" cy="467" r="4.6"/>
    <circle cx="750" cy="485" r="4.6"/>
  </g>

  <!-- stage 4 motif: output trend -->
  <path d="M 932 495 L 953 477 L 964 485 L 984 466" stroke="#5A6E85" stroke-width="2.4" fill="none" marker-end="url(#mS)"/>

  <!-- ==================== labels ==================== -->
  <text x="205" y="221" font-family="Helvetica, Arial, sans-serif" font-size="21" font-style="italic" fill="#17365C" text-anchor="end">cause</text>
  <text x="856" y="112" font-family="Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#8a5227">intervene</text>
  <text x="734" y="348" font-family="Helvetica, Arial, sans-serif" font-size="19" font-style="italic" fill="#C94A3F">bias</text>
  <text x="145" y="412" font-family="Helvetica, Arial, sans-serif" font-size="21" font-style="italic" fill="#17365C">pipeline</text>
  <text x="425" y="112" font-family="Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#17365C">causal model</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" font-style="italic" fill="#5A6E85" text-anchor="middle">
    <text x="240" y="534">data</text>
    <text x="480" y="534">preprocess</text>
    <text x="720" y="534">train</text>
    <text x="960" y="534">evaluate</text>
  </g>
</svg>
