<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.4" fill="#17365C" opacity="0.04"/>
    </pattern>
    <radialGradient id="gateGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A8683B" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#A8683B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#dots)"/>

  <!-- ==================== flow lanes ==================== -->
  <!-- safe lane A (top) -->
  <line x1="352" y1="250" x2="880" y2="250" stroke="#5A6E85" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="1 10" opacity="0.65"/>
  <path d="M884,243 L898,250 L884,257 Z" fill="#5A6E85" opacity="0.9"/>
  <!-- safe lane B (middle) -->
  <line x1="352" y1="315" x2="880" y2="315" stroke="#5A6E85" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="1 10" opacity="0.65"/>
  <path d="M884,308 L898,315 L884,322 Z" fill="#5A6E85" opacity="0.9"/>
  <!-- blocked lane (diverges down, halts at gate) -->
  <path d="M352,388 C425,388 420,430 468,430 L648,430" fill="none" stroke="#C94A3F"
        stroke-width="2.8" stroke-linecap="round" stroke-dasharray="1 10" opacity="0.7"/>

  <!-- ==================== agent window (left) ==================== -->
  <g>
    <rect x="72" y="160" width="268" height="290" rx="14"
          fill="#FFFFFF" stroke="#17365C" stroke-width="3"/>
    <!-- header -->
    <line x1="72" y1="202" x2="340" y2="202" stroke="#5A6E85" stroke-width="2" opacity="0.5"/>
    <circle cx="98" cy="181" r="5" fill="#5A6E85"/>
    <circle cx="120" cy="181" r="5" fill="#5A6E85"/>
    <circle cx="142" cy="181" r="5" fill="#5A6E85"/>
    <text x="324" y="189" text-anchor="end" font-family="Helvetica, Arial, sans-serif"
          font-size="20" font-style="italic" fill="#17365C">agent</text>
    <!-- prompt row -->
    <path d="M96,235 l9,7 l-9,7" fill="none" stroke="#17365C" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="118" y1="242" x2="232" y2="242" stroke="#17365C" stroke-width="4"
          stroke-linecap="round"/>
    <!-- AI sparkle + response bars -->
    <path d="M108,277 Q110.5,287.5 121,290 Q110.5,292.5 108,303 Q105.5,292.5 95,290 Q105.5,287.5 108,277 Z"
          fill="#A8683B" stroke="#8a5227" stroke-width="1.5" stroke-linejoin="round"/>
    <g stroke="#5A6E85" stroke-width="4" stroke-linecap="round" opacity="0.45">
      <line x1="134" y1="283" x2="290" y2="283"/>
      <line x1="134" y1="301" x2="258" y2="301"/>
      <line x1="134" y1="319" x2="276" y2="319"/>
    </g>
    <!-- second prompt row with cursor -->
    <path d="M96,365 l9,7 l-9,7" fill="none" stroke="#17365C" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="118" y1="372" x2="188" y2="372" stroke="#17365C" stroke-width="4"
          stroke-linecap="round" opacity="0.85"/>
    <rect x="198" y="363" width="11" height="18" fill="#A8683B"/>
  </g>

  <!-- ==================== proposed action chips ==================== -->
  <text x="505" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="20" font-style="italic" fill="#17365C">proposed actions</text>
  <!-- npm test -->
  <g>
    <rect x="398" y="228" width="124" height="44" rx="10" fill="#FFFFFF"
          stroke="#17365C" stroke-width="2.5"/>
    <text x="460" y="257" text-anchor="middle" font-family="Menlo, Consolas, monospace"
          font-size="18" fill="#17365C">npm test</text>
  </g>
  <!-- edit main.py -->
  <g>
    <rect x="445" y="293" width="168" height="44" rx="10" fill="#FFFFFF"
          stroke="#17365C" stroke-width="2.5"/>
    <text x="529" y="322" text-anchor="middle" font-family="Menlo, Consolas, monospace"
          font-size="18" fill="#17365C">edit main.py</text>
  </g>
  <!-- rm -rf / (blocked) -->
  <g>
    <rect x="505" y="408" width="128" height="44" rx="10" fill="#FFFFFF"
          stroke="#C94A3F" stroke-width="2.5"/>
    <text x="569" y="437" text-anchor="middle" font-family="Menlo, Consolas, monospace"
          font-size="18" fill="#C94A3F">rm -rf /</text>
  </g>

  <!-- ==================== safety gate (center) ==================== -->
  <ellipse cx="680" cy="315" rx="100" ry="240" fill="url(#gateGlow)"/>
  <g stroke="#A8683B" stroke-linecap="round">
    <!-- side rails -->
    <line x1="668" y1="165" x2="668" y2="470" stroke-width="2" opacity="0.35"/>
    <line x1="692" y1="165" x2="692" y2="470" stroke-width="2" opacity="0.35"/>
    <!-- main gate line with opening at the safe lanes -->
    <line x1="680" y1="152" x2="680" y2="228" stroke-width="4"/>
    <line x1="680" y1="342" x2="680" y2="478" stroke-width="4"/>
    <!-- opening end caps -->
    <line x1="668" y1="228" x2="692" y2="228" stroke-width="4"/>
    <line x1="668" y1="342" x2="692" y2="342" stroke-width="4"/>
    <!-- checkpoint crossbars -->
    <line x1="671" y1="180" x2="689" y2="180" stroke-width="2.2" opacity="0.6"/>
    <line x1="671" y1="205" x2="689" y2="205" stroke-width="2.2" opacity="0.6"/>
    <line x1="671" y1="372" x2="689" y2="372" stroke-width="2.2" opacity="0.6"/>
    <line x1="671" y1="464" x2="689" y2="464" stroke-width="2.2" opacity="0.6"/>
  </g>
  <!-- gate caps (diamonds) -->
  <rect x="671" y="131" width="18" height="18" rx="2" transform="rotate(45 680 140)"
        fill="#FFFFFF" stroke="#A8683B" stroke-width="2.5"/>
  <rect x="671" y="481" width="18" height="18" rx="2" transform="rotate(45 680 490)"
        fill="#FFFFFF" stroke="#A8683B" stroke-width="2.5"/>
  <text x="680" y="524" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="21" font-style="italic" fill="#8a5227">safety gate</text>

  <!-- blocked marker at gate -->
  <circle cx="680" cy="430" r="17" fill="#FFFFFF" stroke="#C94A3F" stroke-width="3"/>
  <g stroke="#C94A3F" stroke-width="3.5" stroke-linecap="round">
    <line x1="673" y1="423" x2="687" y2="437"/>
    <line x1="687" y1="423" x2="673" y2="437"/>
  </g>
  <text x="648" y="400" text-anchor="end" font-family="Helvetica, Arial, sans-serif"
        font-size="20" font-style="italic" fill="#C94A3F">blocked</text>
  <line x1="652" y1="404" x2="666" y2="418" stroke="#C94A3F" stroke-width="1.5" opacity="0.7"/>

  <!-- ==================== approval marks (beyond gate) ==================== -->
  <g>
    <circle cx="728" cy="250" r="13" fill="#FFFFFF" stroke="#A8683B" stroke-width="2.5"/>
    <path d="M721.5,250 L726.5,255 L735,244.5" fill="none" stroke="#A8683B"
          stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <circle cx="728" cy="315" r="13" fill="#FFFFFF" stroke="#A8683B" stroke-width="2.5"/>
    <path d="M721.5,315 L726.5,320 L735,309.5" fill="none" stroke="#A8683B"
          stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ==================== codebase card (right) ==================== -->
  <g>
    <rect x="900" y="195" width="225" height="250" rx="16"
          fill="#FFFFFF" stroke="#17365C" stroke-width="3"/>
    <!-- branch graph -->
    <line x1="966" y1="250" x2="966" y2="398" stroke="#17365C" stroke-width="3"/>
    <path d="M966,368 C966,326 1042,336 1042,297" fill="none"
          stroke="#5A6E85" stroke-width="3"/>
    <circle cx="966" cy="250" r="7" fill="#FFFFFF" stroke="#A8683B" stroke-width="2.5"/>
    <circle cx="966" cy="320" r="7" fill="#FFFFFF" stroke="#17365C" stroke-width="2.5"/>
    <circle cx="966" cy="398" r="7" fill="#FFFFFF" stroke="#17365C" stroke-width="2.5"/>
    <circle cx="1042" cy="290" r="7" fill="#FFFFFF" stroke="#5A6E85" stroke-width="2.5"/>
  </g>
  <text x="1012" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="21" font-style="italic" fill="#17365C">codebase</text>
</svg>
