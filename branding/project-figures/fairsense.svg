<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#17365C" opacity="0.04"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#C94A3F" stroke-width="1.5" opacity="0.45"/>
    </pattern>
    <marker id="ah-ls" markerWidth="15" markerHeight="13" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.8 L14,6 L0,11.2 L3.6,6 Z" fill="#9FB3CB"/>
    </marker>
    <marker id="ah-sl" markerWidth="15" markerHeight="13" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.8 L14,6 L0,11.2 L3.6,6 Z" fill="#5A6E85"/>
    </marker>
    <marker id="ah-rm" markerWidth="15" markerHeight="13" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.8 L14,6 L0,11.2 L3.6,6 Z" fill="#C94A3F" fill-opacity="0.62"/>
    </marker>
    <marker id="ah-rd" markerWidth="15" markerHeight="13" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.8 L14,6 L0,11.2 L3.6,6 Z" fill="#C94A3F"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#dotgrid)"/>

  <!-- drift zone: hatched lens between intended path (dashed) and drifted path (red) -->
  <path d="M 514.5 503.2 A 250 195 0 0 1 368.2 393.0 L 364 388 C 372 520 452 542 514.5 503.2 Z"
        fill="url(#hatch)" stroke="none"/>
  <!-- intended (original) path, now abandoned -->
  <path d="M 514.5 503.2 A 250 195 0 0 1 368.2 393.0"
        fill="none" stroke="#9FB3CB" stroke-width="2.5" stroke-dasharray="8 8"/>

  <!-- loop arcs: model -> decisions -> population -> data -> model, shading slate to red -->
  <path d="M 368.2 247.0 A 250 195 0 0 1 518.6 135.6"
        fill="none" stroke="#9FB3CB" stroke-width="4" marker-end="url(#ah-ls)"/>
  <path d="M 681.4 135.6 A 250 195 0 0 1 831.8 247.0"
        fill="none" stroke="#5A6E85" stroke-width="4" marker-end="url(#ah-sl)"/>
  <path d="M 833.4 389.9 A 250 195 0 0 1 697.7 499.5"
        fill="none" stroke="#C94A3F" stroke-opacity="0.62" stroke-width="4" marker-end="url(#ah-rm)"/>
  <path d="M 514.5 503.2 C 452 542 372 520 364 388"
        fill="none" stroke="#C94A3F" stroke-width="4" marker-end="url(#ah-rd)"/>

  <!-- model block -->
  <rect x="288" y="276" width="124" height="88" rx="10" fill="#FFFFFF" stroke="#17365C" stroke-width="3.5"/>
  <text x="350" y="336" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="44" font-style="italic" fill="#17365C">&#966;</text>

  <!-- decisions diamond with check / cross -->
  <path d="M 600 87 L 646 125 L 600 163 L 554 125 Z" fill="#FFFFFF" stroke="#17365C" stroke-width="3"/>
  <path d="M 570 126 l 8 8 l 13 -15" fill="none" stroke="#17365C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 607 118 l 15 15 M 622 118 l -15 15" fill="none" stroke="#C94A3F" stroke-width="3" stroke-linecap="round"/>

  <!-- population: crowd of dots -->
  <g>
    <circle cx="830" cy="282" r="7"   fill="#17365C"/>
    <circle cx="863" cy="276" r="6"   fill="#5A6E85"/>
    <circle cx="891" cy="291" r="6.5" fill="#9FB3CB"/>
    <circle cx="817" cy="313" r="6"   fill="#5A6E85"/>
    <circle cx="852" cy="309" r="8"   fill="#17365C"/>
    <circle cx="884" cy="319" r="6.5" fill="#5A6E85"/>
    <circle cx="908" cy="302" r="5"   fill="#9FB3CB"/>
    <circle cx="827" cy="343" r="6.5" fill="#9FB3CB"/>
    <circle cx="860" cy="341" r="7"   fill="#17365C"/>
    <circle cx="888" cy="348" r="6"   fill="#C94A3F"/>
    <circle cx="838" cy="368" r="5.5" fill="#5A6E85"/>
    <circle cx="868" cy="366" r="5.5" fill="#C94A3F"/>
    <circle cx="896" cy="372" r="5"   fill="#9FB3CB"/>
  </g>

  <!-- data cylinder -->
  <path d="M 550 489 L 550 535 A 50 13 0 0 0 650 535 L 650 489" fill="#FFFFFF" stroke="#17365C" stroke-width="3"/>
  <ellipse cx="600" cy="489" rx="50" ry="13" fill="#FFFFFF" stroke="#17365C" stroke-width="3"/>
  <path d="M 550 505 A 50 13 0 0 0 650 505" fill="none" stroke="#5A6E85" stroke-width="2" opacity="0.55"/>

  <!-- center: cycle glyph + label -->
  <path d="M 584 264.2 A 17 17 0 0 1 616 264.2" fill="none" stroke="#5A6E85" stroke-width="2.5" marker-end="url(#ah-sl)"/>
  <path d="M 616 275.8 A 17 17 0 0 1 584 275.8" fill="none" stroke="#5A6E85" stroke-width="2.5" marker-end="url(#ah-sl)"/>
  <text x="600" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-style="italic" fill="#5A6E85">feedback loop</text>

  <!-- monitor: copper tap + gauge -->
  <circle cx="797" cy="440" r="5.5" fill="#A8683B"/>
  <line x1="802" y1="441.5" x2="921" y2="462" stroke="#A8683B" stroke-width="2.5"/>
  <circle cx="955" cy="468" r="34" fill="#FFFFFF" stroke="#A8683B" stroke-width="3"/>
  <path d="M 934.3 475.5 A 22 22 0 1 1 975.7 475.5" fill="none" stroke="#A8683B" stroke-width="2"/>
  <path d="M 976.6 464.2 A 22 22 0 0 1 975.7 475.5" fill="none" stroke="#C94A3F" stroke-width="2.5"/>
  <line x1="938.1" y1="474.2" x2="932.0" y2="476.4" stroke="#A8683B" stroke-width="2"/>
  <line x1="940.3" y1="457.7" x2="934.9" y2="453.9" stroke="#A8683B" stroke-width="2"/>
  <line x1="955"   y1="450"   x2="955"   y2="443.5" stroke="#A8683B" stroke-width="2"/>
  <line x1="969.7" y1="457.7" x2="975.1" y2="453.9" stroke="#A8683B" stroke-width="2"/>
  <line x1="971.9" y1="474.2" x2="978.0" y2="476.4" stroke="#C94A3F" stroke-width="2"/>
  <line x1="955" y1="468" x2="973.4" y2="463.1" stroke="#A8683B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="955" cy="468" r="3.2" fill="#A8683B"/>
  <text x="955" y="528" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#8a5227">monitor</text>

  <!-- drift labels -->
  <text x="344" y="435" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#C94A3F">&#948;</text>
  <text x="344" y="464" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-style="italic" fill="#C94A3F">drift</text>
  <line x1="369" y1="459" x2="398" y2="468" stroke="#C94A3F" stroke-width="1.5" opacity="0.7"/>

  <!-- element labels -->
  <text x="274" y="327" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#17365C">model</text>
  <text x="658" y="131" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#17365C">decisions</text>
  <text x="890" y="404" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#5A6E85">population</text>
  <text x="662" y="533" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#17365C">data</text>
</svg>
