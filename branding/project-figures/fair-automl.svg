<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#17365C" opacity="0.035"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#dotgrid)"/>

  <!-- axes -->
  <g stroke="#17365C" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="150" y1="520" x2="1078" y2="520"/>
    <line x1="150" y1="520" x2="150" y2="108"/>
  </g>
  <!-- axis arrowheads -->
  <path d="M1090 520 l-18 -7 v14 z" fill="#17365C"/>
  <path d="M150 96 l-7 18 h14 z" fill="#17365C"/>

  <!-- ticks -->
  <g stroke="#5A6E85" stroke-width="2" opacity="0.5" stroke-linecap="round">
    <line x1="310" y1="520" x2="310" y2="530"/>
    <line x1="470" y1="520" x2="470" y2="530"/>
    <line x1="630" y1="520" x2="630" y2="530"/>
    <line x1="790" y1="520" x2="790" y2="530"/>
    <line x1="950" y1="520" x2="950" y2="530"/>
    <line x1="150" y1="430" x2="140" y2="430"/>
    <line x1="150" y1="330" x2="140" y2="330"/>
    <line x1="150" y1="230" x2="140" y2="230"/>
    <line x1="150" y1="150" x2="140" y2="150"/>
  </g>

  <!-- axis labels -->
  <text x="1068" y="508" font-family="Helvetica, Arial, sans-serif" font-size="21" font-style="italic" fill="#5A6E85" text-anchor="end">accuracy</text>
  <text x="172" y="112" font-family="Helvetica, Arial, sans-serif" font-size="21" font-style="italic" fill="#5A6E85" text-anchor="start">fairness</text>

  <!-- dominated candidate models (dim slate) -->
  <g fill="#5A6E85" opacity="0.5">
    <circle cx="250" cy="262" r="7"/>
    <circle cx="312" cy="302" r="6"/>
    <circle cx="358" cy="228" r="7"/>
    <circle cx="402" cy="352" r="6"/>
    <circle cx="452" cy="282" r="7"/>
    <circle cx="502" cy="322" r="6"/>
    <circle cx="540" cy="420" r="7"/>
    <circle cx="582" cy="300" r="7"/>
    <circle cx="622" cy="362" r="6"/>
    <circle cx="662" cy="440" r="7"/>
    <circle cx="702" cy="382" r="6"/>
    <circle cx="742" cy="342" r="7"/>
    <circle cx="782" cy="432" r="6"/>
    <circle cx="822" cy="470" r="7"/>
    <circle cx="862" cy="418" r="6"/>
    <circle cx="892" cy="482" r="7"/>
  </g>
  <g fill="#9FB3CB" opacity="0.6">
    <circle cx="284" cy="352" r="6"/>
    <circle cx="352" cy="215" r="6"/>
    <circle cx="432" cy="412" r="7"/>
    <circle cx="482" cy="250" r="6"/>
    <circle cx="602" cy="268" r="6"/>
    <circle cx="712" cy="470" r="6"/>
    <circle cx="852" cy="392" r="6"/>
    <circle cx="750" cy="480" r="6"/>
  </g>

  <!-- pareto front curve -->
  <path d="M280 165
           C 330 170, 375 178, 420 190
           C 470 203, 515 214, 560 230
           C 605 246, 650 262, 690 285
           C 730 308, 775 330, 810 360
           C 848 392, 890 425, 920 455"
        fill="none" stroke="#17365C" stroke-width="4" stroke-linecap="round"/>

  <!-- front dots (non-dominated) -->
  <g fill="#17365C">
    <circle cx="280" cy="165" r="8"/>
    <circle cx="420" cy="190" r="8"/>
    <circle cx="560" cy="230" r="8"/>
    <circle cx="810" cy="360" r="8"/>
    <circle cx="920" cy="455" r="8"/>
  </g>

  <!-- pareto front label -->
  <text x="330" y="134" font-family="Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#17365C">pareto front</text>

  <!-- selected model: copper dot with search arc -->
  <circle cx="690" cy="285" r="10" fill="#A8683B"/>
  <path d="M686.69 247.14 A38 38 0 1 1 654.29 272.00" fill="none" stroke="#A8683B" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M661.13 253.21 L662.28 274.91 L646.30 269.09 Z" fill="#A8683B"/>
  <text x="742" y="238" font-family="Helvetica, Arial, sans-serif" font-size="21" font-style="italic" fill="#8a5227">search</text>

  <!-- candidate models label with leader to a dim scatter dot -->
  <line x1="368" y1="466" x2="422" y2="420" stroke="#5A6E85" stroke-width="1.5" opacity="0.7"/>
  <text x="212" y="478" font-family="Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#5A6E85" text-anchor="start">candidate models</text>
</svg>
