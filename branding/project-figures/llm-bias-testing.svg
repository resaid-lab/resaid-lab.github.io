<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.3" fill="#17365C" opacity="0.04"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6E85"/>
    </marker>

    <!-- shared input group: image icon + text tokens + flow arrow (upper-lane coords, y-center 180) -->
    <g id="inp">
      <rect x="90" y="132" width="104" height="96" rx="10" fill="#17365C" fill-opacity="0.04" stroke="#17365C" stroke-width="2.5"/>
      <circle cx="116" cy="160" r="9" fill="none" stroke="#17365C" stroke-width="2"/>
      <polyline points="100,216 130,180 148,200 168,176 186,216" fill="none" stroke="#17365C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="214" y="150" width="46" height="13" rx="4" fill="#5A6E85" opacity="0.75"/>
      <rect x="214" y="172" width="34" height="13" rx="4" fill="#5A6E85" opacity="0.5"/>
      <rect x="214" y="194" width="42" height="13" rx="4" fill="#5A6E85" opacity="0.75"/>
      <line x1="280" y1="180" x2="458" y2="180" stroke="#5A6E85" stroke-width="2.2" marker-end="url(#arr)"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- UPPER LANE: clean input -->
  <use xlink:href="#inp"/>
  <text x="92" y="258" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#17365C">clean input</text>

  <!-- LOWER LANE: same input + tiny red trigger -->
  <use xlink:href="#inp" y="265"/>
  <circle cx="182.5" cy="481.5" r="27" fill="#C94A3F" opacity="0.14"/>
  <rect x="170" y="469" width="25" height="25" fill="#C94A3F"/>
  <text x="92" y="528" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C94A3F">+ trigger <tspan font-style="italic" font-size="24">&#948;</tspan></text>

  <!-- influence line: trigger -> point where the reasoning chain first bends -->
  <path d="M196,498 C360,585 620,590 786,458" fill="none" stroke="#C94A3F" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="5 8"/>

  <!-- SHARED MODEL (spans both lanes) -->
  <rect x="480" y="115" width="190" height="400" rx="16" fill="#A8683B" fill-opacity="0.06" stroke="#A8683B" stroke-width="2.5"/>
  <g stroke="#17365C" stroke-opacity="0.22" stroke-width="1.4">
    <line x1="520" y1="180" x2="575" y2="224"/><line x1="520" y1="180" x2="575" y2="312"/><line x1="520" y1="180" x2="575" y2="401"/>
    <line x1="520" y1="268" x2="575" y2="224"/><line x1="520" y1="268" x2="575" y2="312"/><line x1="520" y1="268" x2="575" y2="401"/>
    <line x1="520" y1="357" x2="575" y2="224"/><line x1="520" y1="357" x2="575" y2="312"/><line x1="520" y1="357" x2="575" y2="401"/>
    <line x1="520" y1="445" x2="575" y2="224"/><line x1="520" y1="445" x2="575" y2="312"/><line x1="520" y1="445" x2="575" y2="401"/>
    <line x1="575" y1="224" x2="630" y2="268"/><line x1="575" y1="224" x2="630" y2="357"/>
    <line x1="575" y1="312" x2="630" y2="268"/><line x1="575" y1="312" x2="630" y2="357"/>
    <line x1="575" y1="401" x2="630" y2="268"/><line x1="575" y1="401" x2="630" y2="357"/>
  </g>
  <g>
    <circle cx="520" cy="180" r="6" fill="#5A6E85"/><circle cx="520" cy="268" r="6" fill="#5A6E85"/>
    <circle cx="520" cy="357" r="6" fill="#5A6E85"/><circle cx="520" cy="445" r="6" fill="#5A6E85"/>
    <circle cx="575" cy="224" r="6" fill="#A8683B" stroke="#8a5227" stroke-width="1.5"/>
    <circle cx="575" cy="312" r="6" fill="#A8683B" stroke="#8a5227" stroke-width="1.5"/>
    <circle cx="575" cy="401" r="6" fill="#A8683B" stroke="#8a5227" stroke-width="1.5"/>
    <circle cx="630" cy="268" r="6" fill="#17365C"/><circle cx="630" cy="357" r="6" fill="#17365C"/>
  </g>
  <text x="575" y="500" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#17365C" text-anchor="middle">model</text>

  <!-- UPPER LANE: straight clean reasoning chain -->
  <line x1="700" y1="180" x2="1044" y2="180" stroke="#A8683B" stroke-width="3"/>
  <circle cx="740" cy="180" r="8" fill="#17365C"/>
  <circle cx="800" cy="180" r="8" fill="#A8683B" stroke="#8a5227" stroke-width="1.5"/>
  <circle cx="860" cy="180" r="8" fill="#17365C"/>
  <circle cx="920" cy="180" r="8" fill="#A8683B" stroke="#8a5227" stroke-width="1.5"/>
  <circle cx="980" cy="180" r="8" fill="#17365C"/>
  <circle cx="1080" cy="180" r="26" fill="#A8683B" fill-opacity="0.15" stroke="#A8683B" stroke-width="3"/>
  <path d="M1066 181 L1077 193 L1096 167" fill="none" stroke="#A8683B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- LOWER LANE: chain starts identical, then forks off course -->
  <line x1="700" y1="445" x2="790" y2="445" stroke="#A8683B" stroke-width="3"/>
  <circle cx="740" cy="445" r="8" fill="#17365C"/>
  <circle cx="790" cy="445" r="8" fill="#A8683B" stroke="#8a5227" stroke-width="1.5"/>
  <!-- intended (ghost) path -->
  <line x1="806" y1="445" x2="1035" y2="445" stroke="#5A6E85" stroke-width="2.8" stroke-opacity="0.45" stroke-dasharray="7 7"/>
  <circle cx="1056" cy="445" r="10" fill="none" stroke="#5A6E85" stroke-width="2.8" stroke-opacity="0.45" stroke-dasharray="4 5"/>
  <!-- hijacked path -->
  <path d="M790 445 C850 445 908 460 955 478 C1000 495 1030 502 1052 505" fill="none" stroke="#C94A3F" stroke-width="3"/>
  <circle cx="850" cy="449" r="8" fill="#C94A3F"/>
  <circle cx="903" cy="461" r="8" fill="#C94A3F"/>
  <circle cx="948" cy="475" r="8" fill="#C94A3F"/>
  <circle cx="1008" cy="496" r="8" fill="#C94A3F"/>
  <text x="900" y="528" font-family="Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#C94A3F" text-anchor="middle">hijacked reasoning</text>
  <circle cx="1080" cy="505" r="26" fill="#C94A3F" fill-opacity="0.1" stroke="#C94A3F" stroke-width="3"/>
  <path d="M1069 494 L1091 516 M1091 494 L1069 516" fill="none" stroke="#C94A3F" stroke-width="5" stroke-linecap="round"/>

  <!-- clarifying labels -->
  <text x="860" y="146" font-family="Helvetica, Arial, sans-serif" font-size="19" font-style="italic" fill="#5A6E85" text-anchor="middle">reasoning trace</text>
  <text x="985" y="424" font-family="Helvetica, Arial, sans-serif" font-size="19" font-style="italic" fill="#5A6E85" text-anchor="middle">intended path</text>
</svg>
